<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias dinâmicas</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem3.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem2.png" type="image/png">
        <img src="imagens/imagem1.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos prender a reproduzir áudio em HTML.</p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midias/NORMAl.mp3" type="audio/mpeg">
        <source src="midias/NORMAl.mp3" type="audio/ogg">
        <source src="midias/NORMAl.mp3" type="audio/wav">
        <p>Infelizmenteseu navegador não consegue reproduzir áudio. <a href="midias/NORMAl.mp3">Clicando aqui para baixar o arquivo MP3.</a></p>
    </audio>
    
    
</body>
</html>
